<style>
:root { --asosiy: #ff6a00; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f6; color: #222; }
header { background: var(--asosiy); padding: 12px; position: sticky; top: 0; z-index: 5; }
.ust { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.ust h1 { margin: 0; color: #fff; font-size: 22px; cursor: pointer; }
.menu-tugma { background: none; border: none; color: #fff; font-size: 28px; padding: 0 4px; }
#qidiruv { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 16px; }

#bosh { padding: 14px 12px 24px; }
.katta { display: flex; align-items: center; gap: 16px; width: 100%; padding: 24px 18px; border: none; border-radius: 16px; background: var(--asosiy); color: #fff; font-size: 21px; font-weight: bold; text-align: left; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.katta .e { font-size: 42px; }
.katta small { display: block; font-weight: normal; font-size: 14px; opacity: 0.9; margin-top: 4px; }

#tablar { display: none; gap: 8px; overflow-x: auto; padding: 12px; }
.bolim { flex: none; padding: 10px 16px; border: none; border-radius: 20px; background: #fff; font-size: 15px; }
.bolim.faol { background: var(--asosiy); color: #fff; }

.setka { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 24px; }
.karta { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.rasm { font-size: 64px; text-align: center; padding: 22px 0; background: #fff1e6; background: color-mix(in srgb, var(--asosiy) 12%, white); }
.matn { padding: 10px; }
.nom { font-weight: bold; font-size: 16px; }
.kichik { color: #777; font-size: 13px; margin: 4px 0 10px; }
.btn { width: 100%; padding: 10px; border: none; border-radius: 10px; background: var(--asosiy); color: #fff; font-size: 15px; }
.bosh-xabar { grid-column: 1 / -1; color: #666; padding: 20px 4px; }

#oyna { display: none; position: fixed; inset: 0; background: #fff; overflow-y: auto; z-index: 10; padding: 16px; }
#oyna h2 { color: var(--asosiy); }
#oyna li { font-size: 17px; margin-bottom: 8px; }
.orqaga { background: #eee; border: none; padding: 10px 16px; border-radius: 10px; font-size: 16px; }
.video { display: block; text-align: center; background: var(--asosiy); color: #fff; padding: 14px; border-radius: 10px; text-decoration: none; font-size: 17px; margin-top: 20px; }

#parda { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 20; }
#menu { position: fixed; top: 0; left: -290px; width: 280px; height: 100%; background: #fff; z-index: 21; padding: 20px 16px; transition: left 0.25s; overflow-y: auto; }
#menu.ochiq { left: 0; }
#menu h3 { margin: 0 0 16px; color: var(--asosiy); }
.mb { display: block; width: 100%; text-align: left; background: #f4f4f6; color: #222; border: none; padding: 14px; border-radius: 10px; font-size: 17px; margin-bottom: 10px; text-decoration: none; }
#panel { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: #fff; z-index: 30; padding: 20px 16px 28px; border-radius: 18px 18px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.25); max-height: 85%; overflow-y: auto; }
#panel h2 { margin-top: 0; color: var(--asosiy); }
#panel li { font-size: 16px; margin-bottom: 6px; }
.narx { font-size: 26px; font-weight: bold; margin: 8px 0 12px; }
.yop { background: #eee; border: none; padding: 12px; border-radius: 10px; font-size: 16px; width: 100%; margin-top: 14px; }
.ranglar { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 0; }
.rang { width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #ccc; }
</style>
</head>

let joriyBolim = ""; // bo'sh = bosh sahifa

function kartaHtml(r, i) {
  return `<div class="karta">
    <div class="rasm">${r.emoji}</div>
    <div class="matn">
      <div class="nom">${r.nom}</div>
      <div class="kichik">${r.davlat} · ${r.vaqt}</div>
      <button class="btn" onclick="ochish(${i})">Retsept</button>
    </div>
  </div>`;
}

function chiz() {
  const soz = document.getElementById("qidiruv").value.trim().toLowerCase();
  const bosh = document.getElementById("bosh");
  const tablar = document.getElementById("tablar");
  const setka = document.getElementById("setka");

  if (soz) {
    // Qidiruv: hamma bo'limlardan
    bosh.style.display = "none";
    tablar.style.display = "none";
    setka.style.display = "grid";
    let html = "";
    retseptlar.forEach((r, i) => {
      if (r.nom.toLowerCase().includes(soz)) html += kartaHtml(r, i);
    });
    setka.innerHTML = html || '<p class="bosh-xabar">Hech narsa topilmadi</p>';
    return;
  }

  if (joriyBolim === "") {
    // Bosh sahifa: 4 ta katta tugma
    tablar.style.display = "none";
    setka.style.display = "none";
    bosh.style.display = "block";
    let html = "";
    bolimlar.forEach(b => {
      const soni = retseptlar.filter(r => r.bolim === b.kod).length;
      html += `<button class="katta" onclick="bolimTanla('${b.kod}')">
        <span class="e">${b.emoji}</span>
        <span>${b.nom}<small>${soni} ta retsept</small></span>
      </button>`;
    });
    bosh.innerHTML = html;
    return;
  }

  // Bo'lim ichi: tepada bo'limlar, ostida retseptlar
  bosh.style.display = "none";
  tablar.style.display = "flex";
  setka.style.display = "grid";
  tablar.innerHTML = bolimlar.map(b =>
    `<button class="bolim ${b.kod === joriyBolim ? "faol" : ""}" onclick="bolimTanla('${b.kod}')">${b.nom}</button>`
  ).join("");
  let html = "";
  retseptlar.forEach((r, i) => {
    if (r.bolim === joriyBolim) html += kartaHtml(r, i);
  });
  setka.innerHTML = html || '<p class="bosh-xabar">Bu bo\'limga tez orada retsept qo\'shiladi</p>';
  const faol = tablar.querySelector(".faol");
  if (faol) faol.scrollIntoView({ inline: "center", block: "nearest" });
}

function bolimTanla(kod) {
  joriyBolim = kod;
  document.getElementById("qidiruv").value = "";
  chiz();
  window.scrollTo(0, 0);
}

function boshSahifa() {
  joriyBolim = "";
  document.getElementById("qidiruv").value = "";
  menuYopish();
  panelYopish();
  yopish();
  chiz();
  window.scrollTo(0, 0);
}

function ochish(i) {
  const r = retseptlar[i];
  let html = `<button class="orqaga" onclick="yopish()">← Orqaga</button>
    <h2>${r.emoji} ${r.nom}</h2>
    <p>${r.davlat} · ${r.vaqt}</p>
    <h3>Ingredientlar</h3><ul>`;
  r.ingredientlar.forEach(x => html += `<li>${x}</li>`);
  html += `</ul><h3>Tayyorlash</h3><ol>`;
  r.qadamlar.forEach(x => html += `<li>${x}</li>`);
  html += `</ol>`;
  if (r.video) {
    html += `<a class="video" href="${r.video}" target="_blank" rel="noopener">▶ Qisqa videoni ko'rish</a>`;
  }
  const oyna = document.getElementById("oyna");
  oyna.innerHTML = html;
  oyna.style.display = "block";
  oyna.scrollTop = 0;
}

function yopish() {
  document.getElementById("oyna").style.display = "none";
}

/* Yon menyu va panellar */
function menuOchish() {
  document.getElementById("menu").classList.add("ochiq");
  document.getElementById("parda").style.display = "block";
}
function menuYopish() {
  document.getElementById("menu").classList.remove("ochiq");
  document.getElementById("parda").style.display = "none";
}

const ranglar = ["#ff6a00", "#e03131", "#d6336c", "#9c36b5", "#5f3dc4", "#2b6fd6", "#0c8599", "#2e9e5b", "#5c940d", "#343a40"];

    <div class="ranglar">` +
    ranglar.map(r => `<button class="rang" style="background:${r}" onclick="rangQoy('${r}')"></button>`).join("") +

function panelOchish(nom) {
  menuYopish();
  const p = document.getElementById("panel");
  p.innerHTML = panellar[nom] + `<button class="yop" onclick="panelYopish()">Yopish</button>`;
  p.style.display = "block";
}
function panelYopish() {
  document.getElementById("panel").style.display = "none";
}

function rangQoy(rang) {
